<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | BROBEX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="theme-dark page-transition">
    <div class="scanlines"></div>

    <main class="page-content section-padding">
        <div class="container contact-container">
            <div class="contact-left animate-on-scroll slide-left">
                <h1 class="huge-headline">LET'S BUILD<br>SOMETHING<br>EXTRAORDINARY.</h1>
                <div class="contact-info">
                    <p class="tech-label">COMMUNICATION CHANNELS</p>
                    <a href="mailto:brobex.ffx@gmail.com" class="contact-link">brobex.ffx@gmail.com</a>
                    <a href="tel:03709995042" class="contact-link">03709995042</a>
                </div>
                <div class="cta-group mt-2">
                    <a href="https://www.instagram.com/codewithbrobex/" target="_blank" class="btn-secondary">INSTAGRAM &rarr;</a>
                </div>
            </div>

            <div class="contact-right animate-on-scroll slide-right">
                <form id="contactForm" class="hud-panel form-panel">
                    <div class="form-group">
                        <label for="name">IDENTIFICATION (NAME)</label>
                        <input type="text" id="name" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="email">TRANSMISSION (EMAIL)</label>
                        <input type="email" id="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="project">PROJECT TYPE</label>
                        <input type="text" id="project" required placeholder="e.g. Website Redesign">
                    </div>
                    <div class="form-group">
                        <label for="message">DATA PAYLOAD (MESSAGE)</label>
                        <textarea id="message" rows="5" required placeholder="Describe your project..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary form-submit">TRANSMIT MESSAGE &rarr;</button>
                    <div id="formSuccess" class="form-success hidden">TRANSMISSION SUCCESSFUL. I WILL RESPOND SHORTLY.</div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
